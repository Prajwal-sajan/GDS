name: v39 Booking Notifications and Loyalty Upgrades
on:
  push:
    branches: [savetrip-screenshotcomplete]
    paths:
      - 'server/api/booking-live-v39.js'
      - 'server/api/loyalty-upgrades-v39.js'
      - 'server/api/ops.js'
      - 'server/index.js'
      - 'server/loyalty-v34.js'
      - 'public/js/booking-notices-v39.js'
      - 'public/js/trips-loyalty-v39.js'
      - 'public/js/trip-parity-v13.js'
      - 'public/js/main.js'
      - 'public/css/booking-loyalty-v39.css'
      - 'public/index.html'
      - 'tests/booking-loyalty-v39-*'
      - 'tests/loyalty-switch-v34-api.cjs'
      - '.github/workflows/booking-loyalty-v39.yml'
  workflow_dispatch:
jobs:
  booking-loyalty-v39:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Source syntax
        run: |
          node --check server/api/booking-live-v39.js
          node --check server/api/loyalty-upgrades-v39.js
          node --check server/api/ops.js
          node --check server/loyalty-v34.js
          node --check server/index.js
          node --check public/js/booking-notices-v39.js
          node --check public/js/trips-loyalty-v39.js
          node --check public/js/trip-parity-v13.js
          node --check public/js/main.js
          node --check tests/booking-loyalty-v39-api.cjs
          node --check tests/booking-loyalty-v39-ui.cjs
      - name: Global live booking event / loyalty API integration
        run: timeout 180s node tests/booking-loyalty-v39-api.cjs
      - name: Booking popup and Trips upgrade UI
        run: timeout 90s node tests/booking-loyalty-v39-ui.cjs
      - name: Existing loyalty configuration and booking regression
        run: |
          node tests/loyalty-switch-v34-api.cjs
          node tests/schedule-bookings-v38-api.cjs
          node tests/schedule-bookings-v38-ui.cjs
          node tests/check-trips-v13.mjs
          npm test
