name: v43 OTA Invoice Dependency Lock
on:
  push:
    branches: [feature/ota-invoice-verifier-v43]
    paths: [package.json, .github/workflows/ota-v43-lock.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve PDF.js dependency without executing install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(OTA v43): resolve pdfjs-dist lockfile"
            git push origin HEAD:feature/ota-invoice-verifier-v43
          fi
