name: modern-ci
on:
  push:
    paths: ["modern/**", "data/db.json", ".github/workflows/modern-ci.yml"]
  pull_request:
    paths: ["modern/**", "data/db.json"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: modern/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build   # Testcontainers: Docker is available on ubuntu runners

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: modern/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: modern/frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
