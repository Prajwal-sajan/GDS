name: modern-ci
on:
  push:
    paths: ["modern/**", "data/db.json", ".github/workflows/modern-ci.yml"]
  pull_request:
    paths: ["modern/**", "data/db.json"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: modern/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Generate isolated synthetic legacy fixture (never use operator data)
        working-directory: .
        env:
          GDS_DATA_DIR: ${{ runner.temp }}/gds-modern-test-fixture
        run: |
          node -e "const db=require('./server/db');require('./server/seed').seed();db.persistNow()"
          test -s "$GDS_DATA_DIR/db.json"
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
        env:
          JOURNEYOS_TEST_LEGACY_DB: ${{ runner.temp }}/gds-modern-test-fixture/db.json

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: modern/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: modern/frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: Prove incomplete production release stays blocked
        working-directory: .
        run: |
          if node modern/scripts/check-release-readiness.mjs > /tmp/gds-release-gate.log 2>&1; then
            cat /tmp/gds-release-gate.log
            echo "Unexpected production release approval" >&2
            exit 1
          fi
          grep -q 'NOT CERTIFIED' /tmp/gds-release-gate.log
          echo "PASS: unverified GDS modules cannot authorize a production cutover."
      - name: Verify original coach geometry, screenshot-poster model, status and privacy
        run: node --test tests/seat-layout-model.test.cjs
      - name: Validate 2+1 and 2+2 coach reference geometry and safe mutations
        run: node --test tests/coach-model.test.cjs
      - name: Install Chromium for real browser UI interaction tests
        run: npx playwright install --with-deps chromium
      - name: Test React Schedules interactions with deterministic mocked API
        run: npx playwright test e2e/schedules-parity.spec.ts e2e/routes-parity.spec.ts e2e/coaches-parity.spec.ts e2e/bookings-parity.spec.ts e2e/invoice-verifier-parity.spec.ts e2e/daily-ops-parity.spec.ts e2e/vehicles-parity.spec.ts e2e/staff-parity.spec.ts --reporter=line
