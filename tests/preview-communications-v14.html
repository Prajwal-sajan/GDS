<style>body{margin:0;background:#f8faff}.demo-shell{background:#fff;border-bottom:1px solid #d8ddfc;padding:6px 4%;display:flex;align-items:center;gap:12px;height:80px}.demo-brand{width:45px;height:45px;background:#fff;border-radius:9px;display:grid;place-items:center;font-weight:bold;color:#e7aa3a}.demo-nav{display:flex;gap:5px;padding:4px;border:1px solid #dce1ff;border-radius:17px}.demo-nav a{padding:10px 20px;color:#2365ef;border:1px solid #e3e6fe;border-radius:15px;text-decoration:none;font-weight:650}.demo-nav a.active{color:white;background:linear-gradient(110deg,#3365f8,#6b57f3)}.iconic-action-cluster{margin-left:auto}.demo-content{margin:10px 4%}.demo-sup{margin:0;color:#93a1bb;font-size:12px} </style></head><body>
